# ---------------------------------------------------------------------------
# Nginx as the load balancer in front of the API replicas (Task 7).
#
# The API was built to sit behind something like this: it is stateless, its
# rate limiter can share state through Redis so the limit holds across
# replicas, and it has separate liveness (/health) and readiness
# (/health/ready) endpoints. This file is where those properties are used.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ---- logging ----------------------------------------------------------
    # The upstream fields are the point of this format: without them a 502
    # tells you the gateway failed but not which replica, and $upstream_status
    # distinguishes "the backend returned 503" from "nginx could not reach a
    # backend at all". $request_id ties a line here to the X-Request-ID the
    # API logs on its side.
    log_format upstream_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"bytes":$body_bytes_sent}';

    access_log /var/log/nginx/access.log upstream_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip            on;
    gzip_types      application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # ---- the pool ---------------------------------------------------------
    upstream api_backend {
        # least_conn rather than round robin: these requests are not uniform.
        # A RAG /v1/ask holds a connection for seconds while a /v1/raw/pages
        # returns in milliseconds, so distributing by *open connections*
        # tracks actual load, where counting requests does not.
        least_conn;

        # Three replicas, named explicitly rather than scaled, so that
        # stopping one of them to demonstrate failover is a single command
        # and the upstream list stays readable in the logs.
        server api1:8080 max_fails=3 fail_timeout=15s;
        server api2:8080 max_fails=3 fail_timeout=15s;
        server api3:8080 max_fails=3 fail_timeout=15s;

        # Passive health checking: after 3 failures inside 15s a replica is
        # taken out of rotation and retried after the same window. Active
        # probing of /health/ready is an Nginx Plus feature; the open-source
        # equivalent is this plus proxy_next_upstream below, which is what
        # actually makes a client's request survive a replica dying.
        keepalive 32;
    }

    # Rate limiting at the edge, in front of the per-key limiting the API
    # does. This one is per IP and exists for a different reason: the API's
    # limiter protects the backends from a *client*, this protects them from
    # a flood that never gets as far as being authenticated.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    server {
        listen 80 default_server;
        # Also on IPv6. Without it the container's own health check, which
        # resolves "localhost" to ::1 first, gets a connection refused while
        # the balancer is serving IPv4 traffic perfectly - a replica reported
        # unhealthy for no reason, which an orchestrator would act on.
        listen [::]:80 default_server;
        server_name _;

        # The API caps its own payloads; this stops a large body from being
        # buffered by the proxy before the API ever sees it.
        client_max_body_size 2m;

        # ---- shared proxy behaviour ----
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generated by nginx when the client did not send one, so every
        # request is traceable end to end. The API echoes it back.
        proxy_set_header X-Request-ID      $request_id;

        # Retry another replica when one fails mid-request. Only idempotent
        # failures are retried by default; non_idempotent is deliberately
        # NOT set, because replaying a POST /v1/ask that may already have
        # been processed would double a generation call.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Longer than the others: /v1/ask runs retrieval and generation.
        proxy_read_timeout    120s;

        # ---- routes ----
        location /v1/ {
            limit_req zone=per_ip burst=100 nodelay;
            limit_conn conn_per_ip 24;
            proxy_pass http://api_backend;
        }

        location /health {
            # Unlimited and unlogged: this is what an orchestrator polls, and
            # it would otherwise be most of the access log.
            access_log off;
            proxy_pass http://api_backend;
        }

        # Prometheus scrapes each replica directly (see
        # docker/prometheus/prometheus.yml), because an aggregate behind the
        # balancer would hide which replica is slow - the one thing per-replica
        # metrics exist to show. This route is kept for a human spot-check.
        location /metrics {
            access_log off;
            proxy_pass http://api_backend;
        }

        # Nginx's own status, scraped by the Prometheus exporter so the
        # balancer is visible in the same dashboard as what it fronts.
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # the compose network
            allow 10.0.0.0/8;      # a Kubernetes pod network
            deny all;
        }

        location = / {
            proxy_pass http://api_backend;
        }

        # A 502 from the balancer and a 503 from the API mean different
        # things, and a client that sees nginx's stock HTML cannot tell. This
        # keeps the JSON envelope the rest of the API uses, so the UI's error
        # handling works for a gateway failure too.
        error_page 502 503 504 = @backend_down;

        location @backend_down {
            default_type application/json;
            add_header Retry-After 10 always;
            # One quoted string, on one line. Nginx does not concatenate
            # adjacent string literals the way C does - splitting this across
            # several quoted parts is "invalid number of arguments in return
            # directive" and the container will not start.
            return 503 '{"error":{"status":503,"type":"no_backend_available","message":"No API replica is currently able to serve this request. The balancer tried every replica in the pool.","request_id":"$request_id"}}';
        }
    }
}
