# ---------------------------------------------------------------------------
# Infrastructure services for the Distributed RAG-Based Web Scraper Framework
#
#   rabbitmq  : message broker holding the dynamic URL frontier queues
#   postgres  : relational store for the raw extracted HTML and parsed data
#
# Start with:   docker compose -f docker/docker-compose.yml up -d
# Inspect with: docker compose -f docker/docker-compose.yml ps
# ---------------------------------------------------------------------------

name: rag-scraper

services:

  rabbitmq:
    # The -management tag adds the web UI on port 15672, which is what makes
    # the queue depth and the consumer count visible while a crawl runs.
    image: rabbitmq:3.13-management
    container_name: rag-rabbitmq
    hostname: rag-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP protocol  (producers / consumers)
      - "15672:15672"    # management UI  (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: scraper
      RABBITMQ_DEFAULT_PASS: scraper_pass
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    ports:
      # 5432 on the host is already used by a locally installed PostgreSQL,
      # so the container is published on 5433 to avoid the clash.
      - "5433:5432"
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper_pass
      POSTGRES_DB: scraped_data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraped_data"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  rabbitmq_data:
  postgres_data:
