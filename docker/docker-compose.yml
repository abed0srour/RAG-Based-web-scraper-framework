# ---------------------------------------------------------------------------
# Infrastructure services for the Distributed RAG-Based Web Scraper Framework
#
#   rabbitmq  : message broker holding the dynamic URL frontier queues
#   postgres  : relational store for the raw extracted HTML and parsed data
#   mongodb   : NoSQL store for the cleaned, normalised JSON documents
#   mongo-express : web UI for browsing the document collection
#   chroma    : vector database holding the embedded text chunks (RAG)
#   elasticsearch : full-text search index behind the web UI (Task 6)
#
# Start with:   docker compose -f docker/docker-compose.yml up -d
# Inspect with: docker compose -f docker/docker-compose.yml ps
# ---------------------------------------------------------------------------

name: rag-scraper

services:

  rabbitmq:
    # The -management tag adds the web UI on port 15672, which is what makes
    # the queue depth and the consumer count visible while a crawl runs.
    image: rabbitmq:3.13-management
    container_name: rag-rabbitmq
    hostname: rag-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP protocol  (producers / consumers)
      - "15672:15672"    # management UI  (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: scraper
      RABBITMQ_DEFAULT_PASS: scraper_pass
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    ports:
      # 5432 on the host is already used by a locally installed PostgreSQL,
      # so the container is published on 5433 to avoid the clash.
      - "5433:5432"
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper_pass
      POSTGRES_DB: scraped_data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraped_data"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mongodb:
    # The processed documents are JSON objects whose site-specific "fields"
    # sub-document has a different shape per website, and they are read back
    # whole. That is a document store's access pattern, not a relational one,
    # so the processing stage of Task 3 writes here rather than to PostgreSQL.
    image: mongo:7.0
    container_name: rag-mongodb
    restart: unless-stopped
    ports:
      # 27017 on the host is already used by a locally installed MongoDB, so
      # the container is published on 27018 to avoid the clash - the same
      # reason PostgreSQL is published on 5433. Inside Docker/Kubernetes the
      # service name and the standard port 27017 are used.
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: scraper
      MONGO_INITDB_ROOT_PASSWORD: scraper_pass
      MONGO_INITDB_DATABASE: processed_data
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-express:
    # Read-only convenience: makes the indexed documents and the indexes
    # themselves visible in a browser, which is what the report screenshots.
    image: mongo-express:1.0.2
    container_name: rag-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"    # http://localhost:8081  (scraper / scraper_pass)
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://scraper:scraper_pass@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: scraper
      ME_CONFIG_BASICAUTH_PASSWORD: scraper_pass

  chroma:
    # The vector database for Task 4. It stores one embedding per text chunk
    # together with the chunk text and its metadata, and answers nearest
    # neighbour queries over them. Chroma is run as a server (rather than
    # embedded in the process) for the same reason as the other stores: every
    # worker node has to read and write the same index.
    #
    # Embeddings are computed by the application with fastembed/ONNX, not by
    # Chroma, so this container needs no model download and no GPU.
    image: chromadb/chroma:0.5.23
    container_name: rag-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"      # REST API  (http://localhost:8000/api/v1/heartbeat)
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # The image has no curl/wget, so the check is made with Python, which
      # ships in the Chroma image itself.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  elasticsearch:
    # The full-text search engine behind the web UI (Task 6). MongoDB's text
    # index can tell you which documents contain a word; this answers what a
    # search interface actually asks - ranked hits, highlighted snippets,
    # facet counts per site and as-you-type suggestions, in one request.
    #
    # The client in requirements.txt is pinned to the same major version
    # (8.17): an 8.x client refuses to talk to a 7.x or 9.x cluster.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: rag-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"      # REST API  (http://localhost:9200)
    environment:
      # A single node, so no quorum to form and no replica to allocate.
      discovery.type: single-node
      # Security off: this is a development cluster on localhost, and TLS
      # plus a bootstrap password would add two setup steps that teach
      # nothing about search. A real deployment turns this back on, sets
      # ELASTIC_USER/ELASTIC_PASSWORD and switches ELASTIC_SCHEME to https.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Elasticsearch sizes its heap from the container's memory by default
      # and will happily take gigabytes. 1 GB is plenty for these corpora.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      # Machine learning is on by default and costs memory this index has no
      # use for.
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      # "yellow" is a healthy single node: with number_of_replicas 0 the
      # index is green, but system indices created by the cluster itself ask
      # for a replica that a one-node cluster cannot place.
      test: ["CMD-SHELL",
             "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

volumes:
  rabbitmq_data:
  postgres_data:
  mongo_data:
  chroma_data:
  elastic_data:
