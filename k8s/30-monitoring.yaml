# ---------------------------------------------------------------------------
# Prometheus and Grafana, in-cluster.
#
# The difference from the compose version is service discovery. Under compose
# the targets are a static list, which is fine because the containers are
# named and fixed. In a cluster the pod set changes every time the HPA acts,
# so the scrape config discovers pods through the Kubernetes API and keeps
# the ones carrying the `prometheus.io/scrape: "true"` annotation - which the
# API and scraper Deployments set on their pod templates. A new replica
# therefore starts being monitored with no configuration change at all.
#
# That discovery is why Prometheus needs RBAC here: read-only access to pods,
# services, endpoints and nodes.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: rag-scraper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-scraper-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rag-scraper-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rag-scraper-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: rag-scraper
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-scraper
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: rag-scraper
        environment: kubernetes

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # One job discovers every annotated pod in the namespace, so the API
      # replicas, the scraper nodes and the Nginx exporters are all picked
      # up by the same rules as they come and go.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [rag-scraper]
        relabel_configs:
          # Opt in, not opt out: only pods that asked to be scraped.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Rewrite the address to the annotated port.
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Carry the pod's identity into the series, which is what makes
          # "which replica is slow" answerable.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: rag-scraper
data:
  # The same intent as docker/prometheus/alert_rules.yml, trimmed to the
  # rules that make sense in a cluster. The `job` label is different here
  # because discovery is by pod, so the expressions select on `app`.
  alert_rules.yml: |
    groups:
      - name: api
        rules:
          - alert: NoApiReplicaAvailable
            expr: count(up{app="api"} == 1) == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Every API replica is down"

          - alert: ApiHighServerErrorRate
            expr: >-
              sum(rate(api_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(api_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "More than 5% of API responses are 5xx"

      - name: scrapers
        rules:
          - alert: ScraperNodeStalled
            # The kubelet restarts the pod on the same condition; this fires
            # so that a restart *loop* is visible rather than silent.
            expr: scraper_heartbeat_age_seconds > 180
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Scraper {{ $labels.instance }} has stored no page in 3 minutes"

          - alert: ScraperRestartLoop
            expr: >-
              increase(kube_pod_container_status_restarts_total{namespace="rag-scraper"}[30m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.pod }} is restarting repeatedly"
              description: >-
                The liveness probe is killing it faster than it can make
                progress - restarting is not fixing the cause. Requires
                kube-state-metrics for this series.

          - alert: FrontierBacklogUnattended
            expr: >-
              sum(scraper_frontier_depth) > 100
              and sum(rate(scraper_pages_stored_total[10m])) == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "URLs are queued but no node is fetching them"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rag-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # The image runs as nobody and needs to own its data directory.
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          # emptyDir for a development cluster: losing fifteen days of
          # metrics on a restart is acceptable here and avoids requiring a
          # PVC. Production uses a PersistentVolumeClaim or remote write.
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rag-scraper
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: http
      nodePort: 30090
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: rag-scraper
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Fixed uid: the dashboard JSON references the data source by uid,
        # and a generated one makes every panel show "datasource not found".
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: rag-scraper
        orgId: 1
        folder: "RAG Scraper"
        type: file
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: rag-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          # The dashboard JSON is the same file the compose stack mounts.
          # Create the ConfigMap from it so there is one copy to maintain:
          #   kubectl -n rag-scraper create configmap grafana-dashboards \
          #     --from-file=docker/grafana/dashboards/rag-scraper.json
          configMap:
            name: grafana-dashboards
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rag-scraper
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: http
      nodePort: 30300
      name: http
